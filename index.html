<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>NWF</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000000;
        color: #eeefeb;
        font-family: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #000000;
      }

      main {
        display: grid;
        height: 100vh;
        height: 100svh;
        min-height: 320px;
        grid-template-rows: 40% 20% 40%;
        place-items: center;
        padding: 0 20px;
      }

      h1 {
        grid-row: 1;
        margin: 0;
        font-size: 96.8px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;
        text-align: center;
        animation: appear 1.2s ease-out both;
      }

      .contact {
        grid-row: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 12px;
        color: #a3a3a3;
        font-size: 18px;
        line-height: 1.5;
        text-decoration: none;
        text-underline-offset: 5px;
      }

      .contact:hover,
      .contact:focus-visible {
        color: #eeefeb;
        text-decoration: underline;
      }

      .contact:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 6px;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 53.24px;
        }
      }

      @media (max-width: 340px) {
        h1 {
          font-size: 43.56px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
        }
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NWF</h1>
      <a class="contact" href="mailto:337915176+nwfarnham@users.noreply.github.com">Contact</a>
    </main>
  </body>
</html>
